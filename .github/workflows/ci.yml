name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (stdlib only, no install)
        run: python3 -m unittest discover -s tests -v
      - name: Validate bundled JSON
        run: |
          python3 -c "
          import json, pathlib
          paths = [
              pathlib.Path('.claude-plugin/plugin.json'),
              pathlib.Path('.codex-plugin/plugin.json'),
              pathlib.Path('hooks/hooks.json'),
              *sorted(pathlib.Path('config').glob('*.json')),
              *sorted(pathlib.Path('examples').glob('*.json')),
              *sorted(pathlib.Path('golden').glob('case-*/*.json')),
              *sorted(pathlib.Path('benchmarks').glob('**/*.json')),
          ]
          def reject(value):
              raise ValueError(f'non-finite JSON number: {value}')
          for p in paths:
              json.loads(p.read_text(), parse_constant=reject)
              print('valid:', p)
          "

  replay-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: init -> run --replay -> eval (deterministic, no LLM)
        run: |
          export CLAUDE_PLUGIN_ROOT="$GITHUB_WORKSPACE"
          export CLAUDE_PROJECT_DIR="$(mktemp -d)"
          "$GITHUB_WORKSPACE/bin/gotenx" init
          "$GITHUB_WORKSPACE/bin/gotenx" run --replay "$GITHUB_WORKSPACE/golden/case-001"
          "$GITHUB_WORKSPACE/bin/gotenx" eval
